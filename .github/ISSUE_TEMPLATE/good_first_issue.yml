---
name: Good first issue
description: A small, well-scoped task suitable for a new contributor.
title: "[good first issue] "
labels: ["good first issue"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping. Keep the change small (docs, a test, or a tiny UI fix).
        Read [CONTRIBUTING.md](https://github.com/ale94lko/llm-workbench/blob/main/CONTRIBUTING.md#small-tasks).
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What should the contributor do? Include files and an acceptance check.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How a reviewer will know this is complete.
    validations:
      required: true
