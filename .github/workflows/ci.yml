name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Coverage thresholds (vitest.config.ts): lines/functions/statements ≥70%, branches ≥55%.
      # Vitest exits non-zero if unmet → this step fails the quality job (and thus the workflow).
      - name: Test
        run: npm run test:coverage

  # Dedicated clean-runner gate: do NOT nest verify:fresh after quality's npm ci.
  # The script itself runs npm ci → build → test:coverage and fails the job on error.
  fresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Fresh clone verify
        run: npm run verify:fresh

  commitlint:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint commit messages
        # wagoid/commitlint-github-action@v6.2.1
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed
