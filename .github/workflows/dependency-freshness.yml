name: Dependency freshness

on:
  schedule:
    # Weekly Monday 08:00 UTC — distinct from Dependabot PRs
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outdated:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report npm outdated
        continue-on-error: true
        run: |
          {
            echo '## npm outdated'
            echo
            echo 'Informational only — this step uses `continue-on-error: true` so outdated packages never fail the workflow. Dependabot still opens weekly update PRs.'
            echo
            echo '```'
            npm outdated --long 2>&1 || true
            echo '```'
          } | tee outdated-report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload outdated report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-outdated
          path: outdated-report.txt
          if-no-files-found: warn
          retention-days: 30
