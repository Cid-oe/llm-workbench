name: Deploy to GitHub Pages

# Deploy only after the CI workflow succeeds on main (no duplicated quality gate).
# Manual runs still execute the quality steps so a broken site cannot be published.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Pin to the commit CI validated (workflow_run) or the dispatch ref.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Manual deploys are not gated by a prior CI run — keep the quality gate here.
      - name: Audit dependencies
        if: github.event_name == 'workflow_dispatch'
        run: npm audit --audit-level=high

      - name: Lint
        if: github.event_name == 'workflow_dispatch'
        run: npm run lint

      - name: Typecheck
        if: github.event_name == 'workflow_dispatch'
        run: npm run typecheck

      - name: Test
        if: github.event_name == 'workflow_dispatch'
        run: npm run test:coverage

      - name: Generate static site
        run: npm run generate
        env:
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/

      - name: Disable Jekyll processing
        run: touch .output/public/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
