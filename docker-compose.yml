services:
  app:
    build: .
    image: llm-workbench:local
    ports:
      - "3000:3000"
    environment:
      NUXT_APP_BASE_URL: /
      NUXT_DEVTOOLS: "false"
      HOST: 0.0.0.0
      PORT: "3000"
    restart: unless-stopped

  # Optional local model runtime. Start with:
  #   docker compose --profile ollama up --build
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  ollama:
